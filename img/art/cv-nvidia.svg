@keyframes cvn-blink{0%,60%{opacity:1}70%{opacity:.35}80%,100%{opacity:1}}
@keyframes cvn-run{0%{transform:translate(0,0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translate(0,-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
