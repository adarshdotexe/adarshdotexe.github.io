<style>
.cvn-bolt{transform-box:fill-box;transform-origin:center;animation:cvn-pulse 4s ease-in-out infinite}
.cvn-led{animation:cvn-blink 3s steps(1) infinite}
.cvn-run{animation:cvn-run 5s linear infinite}
