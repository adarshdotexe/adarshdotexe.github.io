@keyframes bb-fall{0%{transform:translate(0,-6px);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(3px,14px);opacity:0}}
@keyframes bb-cur{0%,100%{transform:translate(0,0)}40%{transform:translate(-6px,-3px)}60%{transform:translate(-6px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
