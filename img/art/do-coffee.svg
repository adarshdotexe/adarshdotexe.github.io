<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="dc-title"><title id="dc-title">A big steaming mug of coffee on a saucer, two empty mugs stacked behind it, a moka pot and scattered coffee beans</title>
<style>
.dc-s1,.dc-s2,.dc-s3{animation:dc-steam 4.5s ease-in-out infinite}
.dc-s2{animation-delay:-1.5s}
.dc-s3{animation-delay:-3s}
.dc-hop{transform-box:fill-box;transform-origin:50% 100%;animation:dc-hop 3.6s ease-in-out infinite}
@keyframes dc-steam{0%,100%{transform:translate(0,1px);opacity:.95}50%{transform:translate(1.5px,-5px);opacity:.4}}
@keyframes dc-hop{0%,62%,100%{transform:translate(0,0) rotate(0)}70%{transform:translate(0,-9px) rotate(-8deg)}78%{transform:translate(0,0) rotate(0)}83%{transform:translate(0,-3px) rotate(4deg)}88%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
