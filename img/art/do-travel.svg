<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="dt-title"><title id="dt-title">A glass-front cabinet of travel trinkets (snow globe, little tower, elephant figurine, seashell, fridge magnet) with a sticker-covered suitcase leaning on it</title>
<style>
.dt-f1,.dt-f2{animation:dt-snow 5s linear infinite}
.dt-f2{animation-delay:-2.5s}
.dt-wob{transform-box:fill-box;transform-origin:50% 100%;animation:dt-wob 4s ease-in-out infinite}
.dt-tag{transform-box:fill-box;transform-origin:50% 0;animation:dt-tag 6s ease-in-out infinite}
@keyframes dt-snow{0%{transform:translate(0,-4px);opacity:1}70%{transform:translate(1.5px,5px);opacity:1}100%{transform:translate(2px,8px);opacity:0}}
@keyframes dt-wob{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}85%{transform:rotate(-2deg)}93%{transform:rotate(1deg)}}
@keyframes dt-tag{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
