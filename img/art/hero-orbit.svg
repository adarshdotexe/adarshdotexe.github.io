<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="ho-t"><title id="ho-t">Decorative orbit around a portrait: a teal disc with a coffee mug, a GPU chip, a film clapperboard, a hexagon game tile, a stopwatch and a paper plane</title><style>.ho-o{stroke:#17191B;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ho-d{stroke:#17191B;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}.ho-z135 .ho-o{stroke-width:1.5px}.ho-z135 .ho-d{stroke-width:0.93px}.ho-z100 .ho-o{stroke-width:2px}.ho-z100 .ho-d{stroke-width:1.25px}.ho-z125 .ho-o{stroke-width:1.6px}.ho-z125 .ho-d{stroke-width:1.00px}.ho-z155 .ho-o{stroke-width:1.3px}.ho-z155 .ho-d{stroke-width:0.81px}.ho-z115 .ho-o{stroke-width:1.7px}.ho-z115 .ho-d{stroke-width:1.09px}.ho-orbit{transform-box:view-box;transform-origin:320px 330px;animation:ho-rot 26s ease-in-out infinite alternate}@keyframes ho-rot{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}.ho-bob{animation:ho-bob 5s ease-in-out infinite alternate}.ho-b1{animation-duration:4.2s}.ho-b2{animation-duration:3.4s;animation-delay:-1.2s}.ho-b3{animation-duration:5.6s;animation-delay:-2s}.ho-b4{animation-duration:6.4s;animation-delay:-.6s}.ho-b5{animation-duration:7s;animation-delay:-3s}@keyframes ho-bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}.ho-steam{animation:ho-steam 3.6s ease-in-out infinite}.ho-s2{animation-delay:-1.2s}.ho-s3{animation-delay:-2.4s}@keyframes ho-steam{0%{transform:translateY(4px);opacity:0}35%{opacity:1}100%{transform:translateY(-6px);opacity:0}}.ho-led{animation:ho-led 2.4s steps(1) infinite}@keyframes ho-led{0%,70%{opacity:1}72%,100%{opacity:.25}}.ho-hand{transform-box:fill-box;transform-origin:center;animation:ho-spin 8s linear infinite}@keyframes ho-spin{to{transform:rotate(360deg)}}.ho-unit{animation:ho-glide 5.2s ease-in-out infinite alternate}@keyframes ho-glide{from{transform:translateX(-3px)}to{transform:translateX(3px)}}.ho-ring{animation:ho-dash 3s line